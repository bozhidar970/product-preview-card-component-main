<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product preview card</title>
 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
 
  <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <article class="card">
        <div class="card__picture">
          <img src="images/image-product-desktop.jpg"
              alt="perfume-picture">
        </div>

        <div class="card__content">
          <p class="card__category">Perfume</p>
          <h1 class="card__title">Gabrielle Essence Eau De Parfum</h1>
          <p class="card__description">
            A floral, solar and voluptuous interpretation composed by
            Olivier Polge, Perfumer-Creator for the House of CHANEL.
          </p>

          <div class="card__price">
            <span class="price-new">$149.99</span>
            <s class="price-old">$169.99</s>
          </div>

          <button class="btn" type="button">
            <img class="btn__icon" src="images/icon-cart.svg" alt="button-icon">
            Add to Cart
          </button>
        </div>
      </article>
    </main>
  </body>
</html>
